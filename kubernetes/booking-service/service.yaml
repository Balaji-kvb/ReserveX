# Booking Service: externally reachable via NodePort (Minikube) or LoadBalancer (EKS).
# WHY: This is the only service external clients call.
# User Service and Event Service are internal (ClusterIP).
#
# For Minikube: NodePort exposes the service on a high port on the Minikube VM.
# Access via: minikube service booking-service -n reservex
#
# For EKS: Change type to LoadBalancer → AWS NLB (Correction #5).
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: reservex
spec:
  type: NodePort
  selector:
    app: booking-service
  ports:
    - port: 5003
      targetPort: 5003
      nodePort: 30003
