# ClusterIP Service: User Service is internal only.
# WHY ClusterIP: Only Booking Service needs to reach it.
# External users never call User Service directly.
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: reservex
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - port: 5001
      targetPort: 5001
